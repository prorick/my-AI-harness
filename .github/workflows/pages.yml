# Publishes the chat page (src/ only) to GitHub Pages — ADR-0001, QST-PAGES-SOURCE = A.
# The tests run first; a failing test blocks the deploy.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# This is a project site: it lives at https://<user>.github.io/my-AI-harness/ and
# does not touch the account's own site at https://<user>.github.io/.

name: Deploy chat page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never interrupts
# a deploy that is already uploading.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/*.test.js"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
